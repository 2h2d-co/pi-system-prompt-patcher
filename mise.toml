[settings]
lockfile = true
locked = true
minimum_release_age = "7d"

[tools]
node = "22.23.2"
npm = "11.19.0"
hk = { version = "2.0.1", postinstall = "hk install --mise" }
betterleaks = "1.8.1"
cocogitto = "7.0.0"
actionlint = "1.7.12"
zizmor = "1.29.0"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[shell_alias]
"pi:local" = "pi --no-extensions -e {{config_root}}"
"pi:npm" = "pi --no-extensions -e npm:pi-system-prompt-patcher"

[tasks.check]
description = "Run all non-writing quality checks and tests"
# In-process SDK tests read Pi's package metadata from PI_PACKAGE_DIR. Bind it to the
# repository's Pi dependency so an inherited value cannot describe another runtime.
env = { PI_PACKAGE_DIR = "{{config_root}}/node_modules/@earendil-works/pi-coding-agent" }
run = ["npm run check", "npm test"]

[tasks."test:live"]
description = "Verify the packaged extension through Pi 0.87.0 and live Anthropic"
run = '''
# Bind the token lookup and the test process to the repository's Pi dependency. The CLI
# subprocess binds PI_PACKAGE_DIR to the selected executable itself.
export PI_PACKAGE_DIR="$PWD/node_modules/@earendil-works/pi-coding-agent"
PI_PATCHER_LIVE_API_KEY="$(./node_modules/.bin/pi auth print-bearer-token --provider anthropic --model claude-sonnet-5)" \
  npm run test:live
'''
